name: fork-probe
on:
  pull_request:
permissions:
  id-token: write
  contents: read
  deployments: write
  statuses: write
jobs:
  deny:
    # Local reference: a PR's probe must test THAT PR's version of the workflow, not main's.
    # The refusal path never reaches the Infisical exchange, so the identity's main-only
    # job_workflow_ref binding is irrelevant here.
    uses: ./.github/workflows/vercel-prebuilt.yml
    with:
      environment: preview
      vercel_org_id: team_UALWOt3DTheRA6BwvmzIA2iD
      vercel_project_id: prj_not_used
      runner: org-1realtour-vercel-build
      node_version: "22"
