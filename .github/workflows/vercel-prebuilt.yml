name: vercel-prebuilt

# Builds a Vercel project on BUILD-RUNNER and deploys the prebuilt output.
# The Vercel token is read from Infisical with this job's GitHub OIDC token.
# Identity vercel-prebuilt (33dd5676-badc-4145-9d06-0d328d53e21f) accepts only
# job_workflow_ref for this file on main, and can read only project vercel-deploy.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: proof runs a connectivity check. deploy is unused here; repositories call this workflow.
        type: string
        default: proof
  workflow_call:
    inputs:
      environment:
        description: preview or production
        required: true
        type: string
      vercel_org_id:
        required: true
        type: string
      vercel_project_id:
        required: true
        type: string
      root_directory:
        required: false
        type: string
        default: "."
      node_version:
        description: Major Node version from the Vercel project settings.
        required: false
        type: string
        default: "24"
      install_command:
        description: Vercel project install command. Empty uses the lockfile.
        required: false
        type: string
        default: ""
      runner:
        description: GitHub Actions runner label. Personal repositories pass their j1v scale set.
        required: true
        type: string
      source_archive:
        description: >-
          Fetch the commit as a source archive (codeload CDN) instead of a git checkout.
          For repositories with a very large tree: on 2026-09-24 BUILD-RUNNER pulled from
          github.com git at 0.7 MB/s but from codeload at 4.6 MB/s. No step here runs git;
          the build gets VERCEL_GIT_* env, but the Vercel deployment record has no commit
          message or author, and project scripts that call git will not work.
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  deployments: write
  statuses: write

# In a called workflow, github.event_name is the CALLER's event (push, pull_request, schedule),
# never 'workflow_call' (GitHub docs: "the github context is always associated with the caller
# workflow"). Keying on it put every run in one '-proof' group with cancel-in-progress, so a PR
# preview cancelled a running production deploy (precision-sd run 35968150138, 2026-09-24).
# inputs.environment is set only for workflow_call runs.
concurrency:
  group: vercel-prebuilt-${{ github.repository }}-${{ inputs.environment || 'proof' }}
  cancel-in-progress: ${{ inputs.environment != 'production' }}

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'proof'
    runs-on: org-1realtour-vercel-build
    timeout-minutes: 10
    steps:
      - name: Show the runner and test egress
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "node=$(uname -n)"
          if [ -f /sys/fs/cgroup/memory.max ]; then echo "memory_max=$(cat /sys/fs/cgroup/memory.max)"; fi
          probe() {
            local spec="$1" expect="$2"
            local host="${spec%:*}" port="${spec##*:}"
            if timeout 5 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
              got=OPEN
            else
              got=CLOSED
            fi
            echo "$spec $got expected $expect"
            [ "$got" = "$expect" ]
          }
          probe 23.95.65.10:22 CLOSED
          probe 23.95.65.10:5432 CLOSED
          probe 100.99.55.167:5433 CLOSED
          probe 192.200.112.194:53211 CLOSED
          probe 104.168.7.138:22 CLOSED
          probe github.com:443 OPEN
          probe registry.npmjs.org:443 OPEN
          probe api.vercel.com:443 OPEN
          probe secrets.1realtour.icu:443 OPEN
          test ! -S /var/run/docker.sock
          test ! -S /run/k3s/containerd/containerd.sock

  deploy:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.root_directory }}
    steps:
      - name: Refuse forks and repositories outside the allowlist
        working-directory: .
        env:
          ALLOWLIST: |
            1REALTOUR/1realtour
            1REALTOUR/1realtour-minimal
            1REALTOUR/1realtour-new
            1REALTOUR/1realtourpms_frontend
            1REALTOUR/ariainteriorfinishes
            1REALTOUR/baystonedepot
            1REALTOUR/buildly-demo
            1REALTOUR/craft-website
            1REALTOUR/dermalactives
            1REALTOUR/dermaltives-ui-example
            1REALTOUR/elleconstructionusa
            1REALTOUR/glc-kitchen-and-bath-remodeling
            1REALTOUR/golden-painters
            1REALTOUR/goldenline-construction
            1REALTOUR/gs-holding
            1REALTOUR/hertitage
            1REALTOUR/kiland-design
            1REALTOUR/kirbywood
            1REALTOUR/lumina-builders
            1REALTOUR/lumina-payload
            1REALTOUR/mbk_remodel
            1REALTOUR/orangegarageanddoors
            1REALTOUR/primo
            1REALTOUR/rhdesignandconstruction
            1REALTOUR/rnrbackyardremodeling
            1REALTOUR/sagahomeremodeling
            1REALTOUR/silver-hammer
            1REALTOUR/smstudioinc
            1REALTOUR/studiomoth-payload
            1REALTOUR/uclazoo
            1REALTOUR/vitalitea
            1REALTOUR/vitalitea-payload
            josephasmith1/berk100
            josephasmith1/coffee-ucla-private
            josephasmith1/da-d-architecture
            josephasmith1/dermalactives-ecommerce
            josephasmith1/dermalactives-mx
            josephasmith1/hillel-digital
            josephasmith1/hillel-graph-site
            josephasmith1/hydrogen-2
            josephasmith1/lumina-builders-crm
            josephasmith1/mbk-portfolio
            josephasmith1/modern-arab-apparel
            josephasmith1/nationaldebtrelief
            josephasmith1/nextjs
            josephasmith1/nextjs-commerce
            josephasmith1/payload-website-starter
            josephasmith1/portfolio-project
            josephasmith1/precision-sd-nextjs
            josephasmith1/sveltekit-commerce
            josephasmith1/treeium-website
            josephasmith1/wintorium-website
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -n "${{ github.event.pull_request.number }}" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "fork pull requests do not receive deployment credentials"
              exit 1
            fi
          fi
          printf '%s\n' "$ALLOWLIST" | sed 's/^[[:space:]]*//' > "$RUNNER_TEMP/allowlist.txt"
          grep -Fxq "${{ github.repository }}" "$RUNNER_TEMP/allowlist.txt"

      - if: ${{ !inputs.source_archive }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Fetch the commit as a source archive
        if: ${{ inputs.source_archive }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$REPO/tarball/$SHA"
          # No curl --retry: a retried transfer would be appended to the same tar stream.
          # Retry the whole download into an emptied workspace instead.
          for attempt in 1 2; do
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
            start=$(date +%s)
            # A new connection often gets a different path: on 2026-09-24 the same 1.5 GB archive
            # took 45+ min at 07:41 and 78 s at 08:27. Give up on a slow transfer (<1 MB/s for
            # 90 s, or >15 min) so the second attempt still fits inside the 45-min job.
            if curl -fsSL --connect-timeout 30 --speed-limit 1048576 --speed-time 90 --max-time 900 \
                -H "Authorization: Bearer $GH_TOKEN" "$url" \
                | tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE"; then
              echo "source archive extracted in $(( $(date +%s) - start ))s: $(du -sm "$GITHUB_WORKSPACE" | cut -f1) MB (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed after $(( $(date +%s) - start ))s"
            sleep $(( attempt * 10 ))
          done
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version || '24' }}

      - name: Install pnpm and the pinned Vercel CLI
        run: |
          set -euo pipefail
          corepack enable
          npm install -g vercel@59.25.4
          vercel --version

      - name: Detect Bun
        id: bun
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          if printf '%s' "$INSTALL_COMMAND" | grep -q bun; then echo "need=true" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then echo "need=true" >> "$GITHUB_OUTPUT"
          else echo "need=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bun
        if: steps.bun.outputs.need == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          if [ -n "$INSTALL_COMMAND" ]; then
            bash -lc "$INSTALL_COMMAND"
          elif [ -f pnpm-lock.yaml ]; then
            PM="$(node -p "require('./package.json').packageManager || ''")"
            if [ -n "$PM" ]; then corepack prepare "$PM" --activate
            else corepack prepare pnpm@10.34.5 --activate
            fi
            pnpm install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          elif [ -f yarn.lock ]; then corepack prepare yarn@1.22.22 --activate && yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install
          else echo "static project: no package.json to install"
          fi

      - name: Read the Vercel token from Infisical
        env:
          INFISICAL_IDENTITY_ID: 33dd5676-badc-4145-9d06-0d328d53e21f
          INFISICAL_PROJECT_ID: d58fa688-73c8-4145-b4f2-0d14eb2c4853
        run: |
          set -euo pipefail
          JWT="$(curl -sf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://secrets.1realtour.icu" | jq -r .value)"
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then echo "OIDC token was not issued"; exit 1; fi
          echo "::add-mask::$JWT"
          ACCESS="$(jq -n --arg i "$INFISICAL_IDENTITY_ID" --arg j "$JWT" '{identityId:$i, jwt:$j}' \
            | curl -sf -X POST https://secrets.1realtour.icu/api/v1/auth/oidc-auth/login \
              -H 'Content-Type: application/json' --data-binary @- | jq -r '.accessToken // empty')"
          if [ -z "$ACCESS" ]; then echo "Infisical OIDC login failed"; exit 1; fi
          echo "::add-mask::$ACCESS"
          RAW="$(curl -sf -H "Authorization: Bearer $ACCESS" \
            "https://secrets.1realtour.icu/api/v4/secrets/VERCEL_API_TOKEN?projectId=${INFISICAL_PROJECT_ID}&environment=prod&secretPath=/&viewSecretValue=true")"
          VALUE="$(printf '%s' "$RAW" | jq -r '.secret.secretValue // .secretValue // empty')"
          if [ -z "$VALUE" ]; then echo "Vercel credential was not returned"; exit 1; fi
          echo "::add-mask::$VALUE"
          echo "VERCEL_TOKEN=$VALUE" >> "$GITHUB_ENV"
          # Kept for the build step: it reads this app's values from its Infisical mirror.
          ( umask 077; printf '%s' "$ACCESS" > "$RUNNER_TEMP/infisical-prebuilt.token" )
          echo "INFISICAL_ACCESS_FILE=$RUNNER_TEMP/infisical-prebuilt.token" >> "$GITHUB_ENV"

      - name: Build and deploy the prebuilt output
        env:
          VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
          VERCEL: "1"
          VERCEL_ENV: ${{ inputs.environment }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          deploy_prebuilt() {
            local attempt
            for attempt in 1 2 3; do
              if [ "$VERCEL_ENV" = "production" ]; then
                vercel deploy --prebuilt --prod --archive=tgz > "$RUNNER_TEMP/deploy-url.txt" && return 0
              else
                vercel deploy --prebuilt --archive=tgz > "$RUNNER_TEMP/deploy-url.txt" && return 0
              fi
              echo "prebuilt deploy attempt ${attempt} failed"
              sleep 20
            done
            return 1
          }
          # Build values come from Infisical, the source of truth (decision 2026-09-23). Vercel
          # never returns `sensitive` values; `vercel pull` writes "[SENSITIVE]" for them unless
          # the env file already holds a local value, which it keeps ("Kept N existing local
          # values" - measured on a throwaway project 2026-09-23). So the file is written first
          # from the app's Infisical mirror, then pulled. Values are never printed.
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          API = "https://secrets.1realtour.icu"
          target = os.environ["VERCEL_ENV"]
          env = {"production": "prod", "preview": "staging"}[target]
          def get(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, {}
          code, proj = get(f"https://api.vercel.com/v9/projects/{os.environ['VERCEL_PROJECT_ID']}"
                           f"?teamId={os.environ['VERCEL_ORG_ID']}", os.environ["VERCEL_TOKEN"])
          name = proj.get("name", "") if code == 200 else ""
          # Same slug rule as bin/infisical-vercel-bootstrap slugify().
          slug = re.sub(r"-{2,}", "-", re.sub(r"[^a-z0-9-]+", "-", name.lower()).strip("-"))[:60]
          slug = slug if len(slug) >= 5 else f"{slug}-vercel"
          token = open(os.environ["INFISICAL_ACCESS_FILE"]).read().strip()
          code, p = get(f"{API}/api/v1/projects/slug/{slug}", token)
          pid = (p.get("project") or p).get("id") if code == 200 else None
          if not pid:
              print(f"::warning::no readable Infisical mirror for {name or '?'} (slug {slug}, "
                    f"HTTP {code}); sensitive values stay Vercel placeholders")
              raise SystemExit(0)
          qs = urllib.parse.urlencode({"workspaceId": pid, "environment": env, "secretPath": "/"})
          code, r = get(f"{API}/api/v3/secrets/raw?{qs}", token)
          if code != 200:
              print(f"::warning::Infisical {slug} {env} not readable (HTTP {code}); using Vercel values")
              raise SystemExit(0)
          vals = {s["secretKey"]: s.get("secretValue") or "" for s in r.get("secrets", [])}
          # Only the keys Vercel hides from `vercel pull` for this target: this fills the
          # placeholders and nothing else (a key deleted in Vercel must not come back).
          code, e = get(f"https://api.vercel.com/v9/projects/{os.environ['VERCEL_PROJECT_ID']}/env"
                        f"?limit=500&teamId={os.environ['VERCEL_ORG_ID']}", os.environ["VERCEL_TOKEN"])
          hidden = {v["key"] for v in e.get("envs", []) if v.get("type") == "sensitive"
                    and target in (v.get("target") or []) and not v.get("gitBranch")}
          vals = {k: v for k, v in vals.items() if v and k in hidden}
          missing = sorted(hidden - set(vals))
          if missing:
              print(f"::warning::{len(missing)} sensitive keys have no value in Infisical {slug} {env}: {missing}")
          def esc(v):  # the Vercel CLI's own escapeValue(): only \n and \r
              return v.replace("\n", "\\n").replace("\r", "\\r")
          os.makedirs(".vercel", exist_ok=True)
          path = os.path.join(".vercel", ".env." + target + ".local")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              f.write("# Created by Vercel CLI\n")
              f.writelines(f'{k}="{esc(v)}"\n' for k, v in sorted(vals.items()))
          print(f"Infisical {slug} {env}: {len(vals)} of {len(hidden)} sensitive values written before vercel pull")
          PY
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi
          # (The former blanking of NEXT_PUBLIC_* "[SENSITIVE]" placeholders is gone: it shipped
          # builds with empty public keys. Values are seeded from Infisical; any placeholder left
          # stops the build below.)
          # Refuse to build with a placeholder. Since 2026-09-24 every production/preview variable is
          # sensitive (Infisical pushes them), so a value Infisical could not seed arrives as
          # "[SENSITIVE]" and would be baked into the build: PMS production served 500 on
          # 2026-09-24 02:09Z for exactly this reason.
          left="$(grep -l '\[SENSITIVE\]' .vercel/.env.*.local 2>/dev/null | head -1 || true)"
          if [ -n "$left" ]; then
            n="$(grep -c '\[SENSITIVE\]' "$left" || true)"
            echo "::error::$n environment values are still the [SENSITIVE] placeholder after seeding from Infisical — refusing to build. Grant this build identity Viewer on the project's Infisical mirror (bin/infisical-vercel-bootstrap memberships)."
            exit 1
          fi
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod
          else
            vercel build
          fi
          deploy_prebuilt
          URL="$(grep -Eo 'https://[^ ]+' "$RUNNER_TEMP/deploy-url.txt" | tail -1)"
          if [ -z "$URL" ]; then echo "deploy did not print a URL"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$URL" >> "$GITHUB_ENV"

      - name: Record the GitHub deployment
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ENV_NAME: ${{ inputs.environment }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEPLOY="$(jq -n --arg ref "$SHA" --arg env "$ENV_NAME" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], description:"prebuilt on BUILD-RUNNER"}')"
          ID="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/deployments" -d "$DEPLOY" | jq -r .id)"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/deployments/${ID}/statuses" \
            -d "$(jq -n --arg url "$deployment_url" --arg log "${SERVER}/${REPO}/actions/runs/${RUN_ID}" \
              '{state:"success", environment_url:$url, log_url:$log, description:"prebuilt deployment"}')" >/dev/null

      - name: Smoke the deployment URL
        if: success()
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl -s -D "$headers" -o /dev/null -w '%{http_code}' "$deployment_url")"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{print $2}' "$headers" | tr -d '\r')"
          rm -f "$headers"
          echo "smoke $deployment_url $code"
          case "$code" in
            200|307|308) ;;
            302) case "$loc" in https://vercel.com/sso-api*) echo "deployment protection is enabled" ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac

      - name: Remove credentials and the workspace
        if: always()
        run: |
          set -euo pipefail
          rm -rf .vercel .env .env.local .env.production .env.preview "$RUNNER_TEMP/deploy-url.txt" || true
          rm -f "$RUNNER_TEMP/infisical-prebuilt.token" || true
          rm -f ~/.npmrc ~/.pnpmrc || true
          cd "$GITHUB_WORKSPACE" && rm -rf ./* ./.??* || true
